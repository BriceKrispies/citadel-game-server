<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Citadel — Multiplayer Demo</title>
  <style>
    body { font-family: system-ui, sans-serif; margin: 1.5rem; max-width: 720px; }
    h1 { font-size: 1.2rem; }
    fieldset { border: 1px solid #ccc; border-radius: 6px; margin-bottom: 1rem; }
    label { display: inline-block; width: 5.5rem; }
    input { width: 12rem; }
    .row { margin: 0.35rem 0; }
    button { padding: 0.4rem 0.8rem; margin-right: 0.4rem; cursor: pointer; }
    #status { font-weight: bold; }
    #state { border-collapse: collapse; width: 100%; }
    #state th, #state td { border: 1px solid #ddd; padding: 0.3rem 0.6rem; text-align: left; }
    #log { background: #111; color: #6f6; font-family: monospace; font-size: 0.8rem;
           height: 12rem; overflow-y: auto; padding: 0.5rem; border-radius: 6px; white-space: pre-wrap; }
  </style>
</head>
<body>
  <h1>Citadel — authoritative multiplayer demo</h1>

  <fieldset>
    <legend>Connection</legend>
    <div class="row"><label for="tenant">Tenant</label><input id="tenant" value="tenant-a" /></div>
    <div class="row"><label for="game">Game</label><input id="game" value="demo-game" /></div>
    <div class="row"><label for="room">Room</label><input id="room" value="room-1" /></div>
    <div class="row"><label for="player">Player</label><input id="player" /></div>
    <div class="row">
      <button id="connect">Connect</button>
      <button id="join">Join Room</button>
      <button id="move">Move Right</button>
    </div>
    <div class="row">Status: <span id="status">disconnected</span></div>
  </fieldset>

  <fieldset>
    <legend>Authoritative state</legend>
    <table id="state">
      <thead><tr><th>Player</th><th>X</th><th>Tick</th></tr></thead>
      <tbody></tbody>
    </table>
  </fieldset>

  <fieldset>
    <legend>Message log</legend>
    <div id="log"></div>
  </fieldset>

  <script src="client.js"></script>
</body>
</html>
